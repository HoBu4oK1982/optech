<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 155.28 155.28" width="155.28" height="155.28">
  <title>OPTECH</title>
  <!-- Фирменный знак OPTECH: три полосы логотипа (элементы .cls-2 в
       OptechLogo.tsx), выровненные по левому краю и расширяющиеся книзу.
       Координаты те же, что в логотипе, сдвинуты к нулю и отцентрованы по
       горизонтали в квадрате. Фон прозрачный — знак одинаково читается и на
       светлой, и на тёмной вкладке; плитку с фоном дают apple-touch-icon и
       icon-192/512 (см. scripts/gen-icons.py). -->
  <g fill="#74adf7">
    <rect x="29.52" y="0.0" width="66.73" height="29.52"/>
    <rect x="29.52" y="61.6" width="82.13" height="29.52"/>
    <rect x="29.52" y="125.78" width="96.25" height="29.5"/>
  </g>
</svg>
